<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Listas</title>
</head>
<body>
    <h2>Lista Desordenada</h2>
    <ul>
        <li>Elemento A</li>
        <li>Elemento B
            <ul>
                <li>Sub-elemento B.1</li>
                <li>Sub-elemento B.2</li>
            </ul>
        </li>
        <li>Elemento C</li>
    </ul>

    <h2>Lista Ordenada</h2>
    <ol>
        <li>Primer paso</li>
        <li>Segundo paso
            <ol>
                <li>Sub-paso detallado</li>
            </ol>
        </li>
        <li>Tercer paso</li>
    </ol>
</body>
</html>
